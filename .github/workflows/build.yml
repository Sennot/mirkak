name: Build Windows

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Win64 mod
    runs-on: windows-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          # Keep CI aligned with mod.json and the loader version this mod targets.
          sdk: 5.8.2
          # Pinned: since geode-sdk/bindings#1347 (2026-10-06) renamed fields of
          # GJGameState with [[renamed_from]], the generated class has an
          # anonymous union of CCPoints and is no longer copyable. Trajectory
          # prediction snapshots and restores the whole game state, so the
          # last bindings commit before that change is used.
          bindings-ref: f050fd74ad531b0827377c97510cb807903ff1b3
          target: Win64
          build-config: RelWithDebInfo
          export-pdb: true
          use-lto: true

      - name: Upload package and symbols
        uses: actions/upload-artifact@v7
        with:
          name: Spout2LayoutFeed-Windows
          path: ${{ steps.build.outputs.build-output }}
          if-no-files-found: error
